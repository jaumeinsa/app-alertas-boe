# Notifikado — stack completo para el VPS de Hostinger.
#   docker compose up -d --build
#
# Incluye:
#   - db:  PostgreSQL persistente
#   - web: la app Next.js (landing + demo + API + dashboard)
#   - cron: worker diario de ingesta + matching
#
# Pon un Nginx/Caddy delante para HTTPS en notifikado.com (ver docs/DEPLOY.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notifikado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifikado}
      POSTGRES_DB: ${POSTGRES_DB:-notifikado}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notifikado}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  # Worker diario: ingesta de boletines + matching.
  # Por simplicidad usa el mismo build; en producción puedes lanzarlo con un
  # cron del host (ver docs/DEPLOY.md) en vez de un contenedor permanente.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Worker en espera. Programa la ingesta con cron del host o un scheduler."
        tail -f /dev/null

volumes:
  pgdata:
